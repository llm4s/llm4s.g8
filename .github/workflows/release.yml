name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'sbt'
      
      - uses: sbt/setup-sbt@v1
      
      - name: Run template tests
        run: sbt test

      - name: Generate and build a project through the giter8 CLI
        run: |
          sbt new file://$GITHUB_WORKSPACE \
            --name=release-test \
            --directory=release-test \
            --force <<< "\n"

          cd release-test
          sbt compile test

  release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: notes
        run: |
          cat << EOF > release_notes.md
          ## LLM4S Template v${{ steps.version.outputs.version }}
          
          ### What's New
          - Template version: ${{ steps.version.outputs.version }}
          - Compatible with LLM4S versions: 0.3.x (default 0.3.4, artifact `org.llm4s %% core`)
          - Supports Scala: 3.7.1 (LLM4S 1.0 is Scala 3 only)
          
          ### Usage
          
          Create a new project with this template version:
          
          \`\`\`bash
          sbt new llm4s/llm4s.g8.git#v${{ steps.version.outputs.version }}
          \`\`\`
          
          ### Full Changelog
          See [CHANGELOG.md](https://github.com/llm4s/llm4s.g8/blob/main/CHANGELOG.md) for detailed changes.
          EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Template v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true