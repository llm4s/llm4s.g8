# scalafmt configuration
version = "3.9.8"
runner.dialect = scala3
maxColumn = 100
style = defaultWithAlign
rewrite.rules = [RedundantParens, RedundantBraces, SortImports, PreferCurlyFors]
spaces.inImportCurlyBraces = true
project.git = true
rewrite.trailingCommas.style = multiple
indentOperator.exemptScope = all

# Optional enhancements
align.preset = more

# Scala‑3 specific (optional)
rewrite.scala3.convertToNewSyntax = true
# Braces are kept deliberately: significant-indentation rewrites are a large stylistic commitment
# for a starter project. Set this to true if you prefer brace-less Scala 3 syntax.
rewrite.scala3.removeOptionalBraces = false

# Token rewrites
rewriteTokens {
    "⇒" = "=>",
    "←" = "<-",
    "→" = "->";
}
