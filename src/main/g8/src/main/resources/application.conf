# LLM4S configuration.
#
# LLM4S reads its configuration through `Llm4sConfig` (Typesafe Config + PureConfig) rather than
# reading environment variables in application code. Each chat provider is a *named section*
# under llm4s.providers, and `llm4s.providers.provider` names the one
# `Llm4sConfig.defaultProvider()` loads. Only that section is validated, so a section whose API
# key is not set does no harm until you select it.
#
# A section's `provider` must be supplied by a module on the classpath: "ollama" comes from
# llm4s-ollama and "openai" from llm4s-openai, both already in build.sbt.

llm4s {
  providers {
    # The named section used by `Llm4sConfig.defaultProvider()`.
    # Ollama runs locally and needs no API key, so this works as soon as Ollama is running.
    # Switch with LLM4S_PROVIDER=openai-main (or edit this line).
    provider = "ollama-local"
    provider = \${?LLM4S_PROVIDER}

    # Local models through Ollama (https://ollama.com): `ollama pull llama3.2` first.
    ollama-local {
      provider = "ollama"
      model = "llama3.2"
      model = \${?OLLAMA_MODEL}
      baseUrl = "http://localhost:11434"
      baseUrl = \${?OLLAMA_BASE_URL}
    }

    # OpenAI. No apiKey is needed here: llm4s-openai binds OPENAI_API_KEY to
    # llm4s.credentials.openai.apiKey, which every "openai" section without its own key uses.
    # Set `apiKey = \${?SOME_OTHER_VAR}` in a section to use a different account.
    openai-main {
      provider = "openai"
      model = "gpt-4o-mini"
      model = \${?OPENAI_MODEL}
    }

    # Other providers: add the module to build.sbt, uncomment a section, and point `provider`
    # above at it. The vendor's usual variable is bound for you, as for OpenAI.
    #
    # anthropic-main {            # needs llm4s-anthropic; reads ANTHROPIC_API_KEY
    #   provider = "anthropic"
    #   model = "claude-sonnet-4-5"
    # }
    #
    # gemini-main {               # needs llm4s-gemini; reads GOOGLE_API_KEY (or GEMINI_API_KEY)
    #   provider = "gemini"
    #   model = "gemini-2.5-flash"
    # }
  }
}
