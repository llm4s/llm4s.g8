# LLM4S configuration.
#
# LLM4S reads its configuration through `Llm4sConfig` (PureConfig under the hood) rather than
# reading environment variables directly, so secrets are wired in here with \${?ENV_VAR}
# substitutions: the key is simply absent when the variable is unset, and
# `Llm4sConfig.defaultProvider()` then returns a Left explaining what is missing.
#
# Every named provider listed below is validated, so add a section only once you have the
# corresponding API key available.

llm4s {
  providers {
    # The named provider used by `Llm4sConfig.defaultProvider()`.
    provider = "openai-main"
    provider = \${?LLM4S_PROVIDER}

    openai-main {
      provider = "openai"
      model = "gpt-4o"
      model = \${?OPENAI_MODEL}
      apiKey = \${?OPENAI_API_KEY}
    }

    # Other providers — uncomment one and point `provider` above at it.
    #
    # anthropic-main {
    #   provider = "anthropic"
    #   model = "claude-sonnet-4-5-latest"
    #   apiKey = \${?ANTHROPIC_API_KEY}
    # }
    #
    # ollama-local {
    #   provider = "ollama"
    #   model = "llama3.1"
    #   baseUrl = "http://localhost:11434"
    # }
  }
}
